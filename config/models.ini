; llama-server 라우터 프리셋.
;
; 섹션 이름이 API 요청의 "model" 값이 된다. 키는 `--` 를 뗀 CLI 옵션명이다.
; 라우터 모드로 띄우면 요청마다 모델이 온디맨드로 교체되므로, 파이프라인 쪽에서
; 서버를 재기동할 필요가 없다 (실측: 콜드 적재 26초, 교체 41초).
;
; 공통 섹션을 만들어도 **상속되지 않는다**. `[common]` 을 두고 확인해 보니 그
; 섹션이 별개 모델로 등록될 뿐이고, 다른 섹션의 인자에는 반영되지 않았다
; (VRAM 사용량이 q8_0 KV 가 아니라 f16 KV 와 일치했다). 그래서 아래처럼
; 섹션마다 전부 명시한다. 중복이 보기 싫지만 조용히 빠지는 것보다 낫다.
;
; 플래그 근거는 ~/Developments/llamacpp/run_llama_server.sh 의 실측표를 따랐다.
;   - cache-type q8_0 : f16 대비 VRAM 절반, 속도 손해 없음 → 같은 VRAM 으로 2배 긴 컨텍스트
;   - parallel 1      : 개인용은 동시 요청이 없으므로 지연시간에 유리
;   - flash-attn on   : 필수. 끄면 KV 캐시가 커진다
;
; 2026-08-23 하드웨어 교체 후 재작성. GPU 가 MI50 32GB(ROCm) → CMP 170HX 64GB(CUDA)
; 로 바뀌면서 모델 라인업이 전부 달라졌다. 지금 있는 가중치만 적는다.
; 각 모델 디렉터리의 `_mtp.gguf` 는 multi-token prediction 헤드다. 지금 빌드는
; `--model-draft` 로만 투기적 디코딩을 받으므로 쓰지 않는다 (미검증).

[qwen-vl]
; 판독(비전) 담당. image-min-tokens 는 Qwen-VL 전용 처방이다 — 작은 말풍선을
; 크롭해 보낼 때 이미지 토큰이 부족하면 큰 세로쓰기 블록이 통째로 EMPTY 로 온다.
; 이전 측정은 같은 모델의 Q4_K_M 이었다. 양자화는 이 작업에 영향이 없다고
; 두 계열에서 반증됐으므로 Q8_K_P 를 그대로 쓴다 (다만 가중치가 43.6GB 라
; ctx 를 이전 93184 에서 줄였다 — 64GB 에 KV 까지 얹어야 한다).
model = /home/lota/Developments/llamacpp/models/HauhauCS_Qwen3.6-35B-A3B-Uncensored-Aggressive-Q8_K_P/HauhauCS_Qwen3.6-35B-A3B-Uncensored-Aggressive-Q8_K_P.gguf
mmproj = /home/lota/Developments/llamacpp/models/HauhauCS_Qwen3.6-35B-A3B-Uncensored-Aggressive-Q8_K_P/HauhauCS_Qwen3.6-35B-A3B-Uncensored-Aggressive-Q8_K_P_mmproj-f16.gguf
image-min-tokens = 1024
ctx-size = 65536
n-gpu-layers = 99
parallel = 1
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
reasoning = on

